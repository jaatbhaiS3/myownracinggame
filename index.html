<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Racer-JAATKARacing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'GREEN'
            ', sans-serif;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: linear-gradient(180deg, #22AA22 0%, #44CC44 100%);
            border: 3px red #333333;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(180deg, #22AA22 0%, #44CC44 100%);
        }

        .ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.786);
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #cd1b1b;
            z-index: 10;
        }

        .ui-item {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 5px;
            display: inline-block;
            margin-right: 10px;
        }

        .ui-right {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        .game-over-screen.show {
            display: flex;
        }

        .game-over-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff6b6b;
            text-shadow: 0 0 20px #ff6b6b;
        }

        .game-over-screen p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        .game-over-screen button {
            padding: 12px 30px;
            font-size: 18px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .game-over-screen button:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border-radius: 5px;
            z-index: 10;
        }

        .instructions-desktop {
            display: block;
        }

        @media (max-width: 600px) {
            .instructions-desktop {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div class="ui">
            <div class="ui-item">🏎️ Speed: <span id="speed">0</span></div>
            <div class="ui-item">📍 Distance: <span id="distance">0</span>m</div>
        </div>

        <div class="ui ui-right">
            <div class="ui-item">⭐ Score: <span id="score">0</span></div>
            <div class="ui-item">💥 Crashes: <span id="crashes">0</span></div>
        </div>

        <div class="instructions instructions-desktop">
            ← → Arrow Keys or A/D to Move | Space to Boost
        </div>

        <div class="game-over-screen" id="gameOverScreen">
            <h1 id="gameOverTitle">GAME OVER!</h1>
            <p>Score: <span id="finalScore">0</span></p>
            <p>Distance: <span id="finalDistance">0</span>m</p>
            <p id="gameOverMessage"></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game variables
        let gameRunning = true;
        let score = 0;
        let crashes = 0;
        let distance = 0;

        // Player car
        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 80,
            width: 30,
            height: 50,
            speed: 0,
            maxSpeed: 8,
            acceleration: 0.3,
            friction: 0.95,
            boostActive: false,
            boostTimer: 0
        };

        // Enemies (obstacles)
        let enemies = [];
        let enemySpawnRate = 100;
        let enemySpawnCounter = 0;

        // Coins (bonuses)
        let coins = [];
        let coinSpawnRate = 150;
        let coinSpawnCounter = 0;

        // Road scrolling
        let roadOffset = 0;

        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                if (!player.boostActive) {
                    player.boostActive = true;
                    player.boostTimer = 20;
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Enemy class
        class Enemy {
            constructor() {
                this.width = 30;
                this.height = 50;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = 3 + Math.random() * 2;
                this.wobble = Math.random() * 0.5 - 0.25;
            }

            update() {
                this.y += this.speed;
                this.x += this.wobble;
                // Keep within bounds
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
            }

            draw() {
                // Enemy car body
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Windows
                ctx.fillStyle = '#4488ff';
                ctx.fillRect(this.x + 5, this.y + 10, 8, 12);
                ctx.fillRect(this.x + 17, this.y + 10, 8, 12);
                
                // Lights
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(this.x + 5, this.y - 2, 8, 2);
                ctx.fillRect(this.x + 17, this.y - 2, 8, 2);
            }

            isCollidingWith(rect) {
                return this.x < rect.x + rect.width &&
                       this.x + this.width > rect.x &&
                       this.y < rect.y + rect.height &&
                       this.y + this.height > rect.y;
            }
        }

        // Coin class
        class Coin {
            constructor() {
                this.width = 20;
                this.height = 20;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = 3;
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, this.width / 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#FFA500';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', this.x + this.width / 2, this.y + this.height / 2);
            }

            isCollidingWith(rect) {
                return this.x < rect.x + rect.width &&
                       this.x + this.width > rect.x &&
                       this.y < rect.y + rect.height &&
                       this.y + this.height > rect.y;
            }
        }

        // Draw player car
        function drawPlayer() {
            // Boost effect
            if (player.boostActive) {
                ctx.fillStyle = 'rgba(255, 165, 0, 0.5)';
                ctx.fillRect(player.x - 5, player.y + player.height, player.width + 10, 15);
            }

            // Ferrari car body - sleek red
            ctx.fillStyle = '#E00000';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Ferrari stripe
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(player.x + 12, player.y, 6, player.height);

            // Front spoiler
            ctx.fillStyle = '#333';
            ctx.fillRect(player.x + 5, player.y - 3, 20, 3);

            // Ferrari prancing horse logo
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐴', player.x + player.width / 2, player.y + 15);

            // Windows - sleek
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(player.x + 3, player.y + 20, 10, 10);
            ctx.fillRect(player.x + 17, player.y + 20, 10, 10);

            // Headlights - Ferrari style
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(player.x + 8, player.y - 1, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + 22, player.y - 1, 2, 0, Math.PI * 2);
            ctx.fill();

            // Racing wheels
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(player.x + 6, player.y + 8, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + 24, player.y + 8, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + 6, player.y + 40, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + 24, player.y + 40, 4, 0, Math.PI * 2);
            ctx.fill();

            // Wheel rims - shiny
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(player.x + 6, player.y + 8, 3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(player.x + 24, player.y + 8, 3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(player.x + 6, player.y + 40, 3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(player.x + 24, player.y + 40, 3, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Draw road
        function drawRoad() {
            // Road - grass green
            ctx.fillStyle = '#1a6b1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Road lanes
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 10]);

            // Center line
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, roadOffset);
            ctx.lineTo(canvas.width / 2, roadOffset + canvas.height);
            ctx.stroke();

            // Side lines
            ctx.setLineDash([]);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(20, 0);
            ctx.lineTo(20, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(canvas.width - 20, 0);
            ctx.lineTo(canvas.width - 20, canvas.height);
            ctx.stroke();

            roadOffset = (roadOffset + player.speed * 2) % 40;
        }

        // Update game
        function update() {
            // Player movement
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.x -= 5;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x += 5;
            }

            // Keep player in bounds
            if (player.x < 20) player.x = 20;
            if (player.x + player.width > canvas.width - 20) player.x = canvas.width - player.width - 20;

            // Boost
            if (player.boostActive) {
                player.speed = Math.min(player.maxSpeed + 3, player.speed + player.acceleration);
                player.boostTimer--;
                if (player.boostTimer <= 0) {
                    player.boostActive = false;
                }
            } else {
                player.speed = Math.min(player.maxSpeed, player.speed + player.acceleration);
            }

            player.speed *= player.friction;

            distance = Math.floor(distance + player.speed);

            // Spawn enemies
            enemySpawnCounter++;
            if (enemySpawnCounter > enemySpawnRate) {
                enemies.push(new Enemy());
                enemySpawnCounter = 0;
                enemySpawnRate = Math.max(40, enemySpawnRate - 2);
            }

            // Spawn coins
            coinSpawnCounter++;
            if (coinSpawnCounter > coinSpawnRate) {
                coins.push(new Coin());
                coinSpawnCounter = 0;
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update();

                // Check collision
                if (enemies[i].isCollidingWith(player)) {
                    crashes++;
                    score = Math.max(0, score - 100);
                    // Push player back
                    player.y -= 30;
                    player.speed *= 0.5;

                    if (crashes >= 5) {
                        endGame();
                    }
                }

                // Remove off-screen enemies
                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    score += 10;
                }
            }

            // Update coins
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].update();

                // Check collision
                if (coins[i].isCollidingWith(player)) {
                    coins.splice(i, 1);
                    score += 50;
                } else if (coins[i].y > canvas.height) {
                    coins.splice(i, 1);
                }
            }

            // Update UI
            document.getElementById('speed').textContent = Math.floor(player.speed);
            document.getElementById('distance').textContent = Math.floor(distance);
            document.getElementById('score').textContent = score;
            document.getElementById('crashes').textContent = crashes;
        }

        // Draw game
        function draw() {
            drawRoad();

            // Draw enemies
            enemies.forEach(enemy => enemy.draw());

            // Draw coins
            coins.forEach(coin => coin.draw());

            // Draw player
            drawPlayer();
        }

        // Game loop
        function gameLoop() {
            if (gameRunning) {
                update();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        // End game
        function endGame() {
            gameRunning = false;
            const gameOverScreen = document.getElementById('gameOverScreen');
            gameOverScreen.classList.add('show');
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalDistance').textContent = Math.floor(distance);
            
            let message = '';
            if (score > 5000) {
                message = '🏆 LEGEND! You are a master racer!';
            } else if (score > 2000) {
                message = '🥇 Awesome! You\'re a great driver!';
            } else if (score > 500) {
                message = '🥈 Good job! Keep practicing!';
            } else {
                message = '💪 Keep trying! You\'ll get better!';
            }
            document.getElementById('gameOverMessage').textContent = message;
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
